<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>TireTrack – ระบบจัดการจองยาง</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0d14;--surf:#111520;--s2:#181d2e;--s3:#1e2438;
  --bd:#252b3d;--b2:#2e3650;
  --tx:#e8ecf4;--t2:#8b92a9;--t3:#5a6177;
  --ac:#3b82f6;--a2:#1d4ed8;--ag:rgba(59,130,246,.15);
  --gn:#22c55e;--gb:rgba(34,197,94,.12);
  --yw:#eab308;--yb:rgba(234,179,8,.12);
  --rd:#ef4444;--rb:rgba(239,68,68,.12);
  --or:#f97316;
  --r:12px;--rs:8px;--rl:16px;
  --font:'Sarabun',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* ── HEADER ── */
.hdr{background:var(--surf);border-bottom:1px solid var(--bd);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;font-family:var(--mono);letter-spacing:-.5px}
.logo-text{font-size:17px;font-weight:700;letter-spacing:-.3px}
.logo-text b{color:var(--ac)}
.role-tag{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .2s}
.role-tag:hover{background:var(--s2)}
.role-dot{width:7px;height:7px;border-radius:50%}
.bpill{background:var(--s2);border:1.5px solid var(--b2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ac);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--mono);transition:all .2s}
.bpill:hover{border-color:var(--ac);background:var(--ag)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--gn);animation:lp 2s infinite}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}

/* ── BOTTOM NAV ── */
.bnav{background:var(--surf);border-top:1px solid var(--bd);display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px;cursor:pointer;border:none;background:none;color:var(--t3);font-family:var(--font);font-size:10px;font-weight:500;transition:color .2s;position:relative}
.ntab.on{color:var(--ac)}
.ntab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--ac);border-radius:0 0 2px 2px}
.nbadge{position:absolute;top:4px;right:calc(50% - 19px);background:var(--rd);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ── CONTENT ── */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 90px}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}

/* ── SECTION HEADER ── */
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.st{font-size:18px;font-weight:700;letter-spacing:-.3px}
.ss{font-size:13px;color:var(--t2);margin-top:2px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;height:48px;border-radius:var(--rs);font-family:var(--font);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.bp{background:var(--ac);color:#fff}.bp:active{background:var(--a2)}
.bo{background:transparent;color:var(--tx);border:1.5px solid var(--b2)}.bo:active{border-color:var(--ac);color:var(--ac)}
.bs{background:var(--gn);color:#fff}.bd2{background:var(--rd);color:#fff}
.bsm{height:36px;padding:0 14px;font-size:13px;border-radius:8px}
.bxs{height:30px;padding:0 10px;font-size:12px;border-radius:6px}
.bw{width:100%}

/* ── FORMS ── */
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.fi,.fs{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:12px 14px;color:var(--tx);font-family:var(--font);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.fi:focus,.fs:focus{border-color:var(--ac);background:var(--s3);box-shadow:0 0 0 3px var(--ag)}
.fi::placeholder{color:var(--t3)}
.fs{appearance:none;cursor:pointer}
.fs option{background:var(--s2)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── STATS ── */
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px}
.sl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sv{font-size:25px;font-weight:700;font-family:var(--mono);letter-spacing:-1px;line-height:1}
.ss2{font-size:11px;color:var(--t2);margin-top:3px}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.4}
.bgg{background:var(--gb);color:var(--gn)}
.bgy{background:var(--yb);color:var(--yw)}
.bgr{background:var(--rb);color:var(--rd)}
.bgb{background:var(--ag);color:var(--ac)}
.bgx{background:rgba(139,146,169,.1);color:var(--t2)}

/* ── PROGRESS ── */
.pb{height:7px;background:var(--s3);border-radius:4px;overflow:hidden;margin-bottom:6px}
.pf{height:100%;border-radius:4px;transition:width .6s ease}
.pg{background:linear-gradient(90deg,#16a34a,var(--gn))}
.py{background:linear-gradient(90deg,#ca8a04,var(--yw))}
.pr{background:linear-gradient(90deg,#b91c1c,var(--rd))}

/* ── RESERVATION CARD ── */
.rc{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative;overflow:hidden;transition:border-color .2s}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.rc.sup::before{background:var(--ac)}
.rc.sarr::before{background:var(--gn)}
.rc.sov::before{background:var(--rd)}
.rh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.rn{font-size:16px;font-weight:700}
.rp{font-size:12px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:5px}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rdl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px}
.rdv{font-size:13px;font-weight:500;color:var(--tx);margin-top:2px}
.rf{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ── MODAL / BOTTOM SHEET ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fa .2s}
@keyframes fa{from{opacity:0}to{opacity:1}}
.sh2{background:var(--surf);border-radius:20px 20px 0 0;border:1px solid var(--bd);border-bottom:none;width:100%;max-width:480px;max-height:93vh;overflow-y:auto;animation:fup .28s ease}
@keyframes fup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hdl{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:12px auto 16px;display:block}
.mh{display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px;border-bottom:1px solid var(--bd);margin-bottom:18px}
.mt2{font-size:18px;font-weight:700}
.mb2{padding:0 20px}
.mf{padding:14px 20px 22px}
.xb{width:32px;height:32px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.xb:hover{background:var(--s3);color:var(--tx)}

/* ── BRANCH PICKER ── */
.bgr2{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;padding-bottom:4px}
.bb{background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:13px 4px;text-align:center;cursor:pointer;transition:all .15s;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--t2)}
.bb.on{background:var(--ag);border-color:var(--ac);color:var(--ac)}
.bb:hover{border-color:var(--ac);color:var(--ac)}

/* ── SEARCH BAR ── */
.sbar{display:flex;align-items:center;gap:10px;background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:0 14px;margin-bottom:14px;height:46px;transition:border-color .15s}
.sbar:focus-within{border-color:var(--ac)}
.sbar input{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:15px;color:var(--tx)}
.sbar input::placeholder{color:var(--t3)}

/* ── FILTER CHIPS ── */
.fchips{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fc{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:none;color:var(--t2);white-space:nowrap;font-family:var(--font);transition:all .15s}
.fc.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* ── DATE NAV ── */
.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.dnb{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:var(--s2);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.dnb:hover{border-color:var(--ac);color:var(--ac)}
.dinfo{text-align:center;flex:1}
.dinfo-main{font-size:16px;font-weight:700}
.dinfo-sub{font-size:12px;color:var(--t2);margin-top:1px}

/* ── EMPTY STATE ── */
.emp{text-align:center;padding:44px 20px}
.emp-ico{font-size:44px;margin-bottom:14px;opacity:.35}
.emp-t{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:5px}
.emp-s{font-size:13px;color:var(--t3);line-height:1.6}

/* ── CONFIRM ── */
.cov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fa .2s}
.cdlg{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:24px;max-width:310px;width:100%;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

/* ── TOAST ── */
.tcon{position:fixed;top:64px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:500;pointer-events:none}
.toast{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tslide .25s ease;pointer-events:all}
@keyframes tslide{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg{border-left:3px solid var(--gn)}.te{border-left:3px solid var(--rd)}

/* ── METRIC BOX ── */
.mbox{background:linear-gradient(135deg,rgba(59,130,246,.09),rgba(99,102,241,.04));border:1px solid rgba(59,130,246,.22);border-radius:var(--r);padding:18px;margin-bottom:14px;text-align:center}
.mnum{font-size:44px;font-weight:700;font-family:var(--mono);letter-spacing:-2px;line-height:1.1}
.munit{font-size:18px;font-weight:400;color:var(--t2)}

/* ── RANK ROW ── */
.rr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rr:last-child{border-bottom:none}

/* ── DIVIDER ── */
.dv{height:1px;background:var(--bd);margin:12px 0}

/* ── UTILS ── */
.gn{color:var(--gn)}.yw{color:var(--yw)}.rd2{color:var(--rd)}.bl{color:var(--ac)}.mu{color:var(--t2)}
.mono{font-family:var(--mono)}.bld{font-weight:700}.sem{font-weight:600}
.fx{display:flex}.fxa{display:flex;align-items:center}.fxb{display:flex;align-items:center;justify-content:space-between}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}
.mb1{margin-bottom:4px}.mb2b{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.mt1{margin-top:4px}.mt2b{margin-top:8px}
.w100{width:100%}.tc{text-align:center}
.tsm{font-size:13px}.txs{font-size:11px}
.upr{text-transform:uppercase;letter-spacing:.5px}
</style>
</head>

<script>
(function(){

function uid(){ return Math.random().toString(36).slice(2,9); }

function todayStr(){
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
}

function addDays(str, n){
  const d = new Date(str+'T00:00:00');
  d.setDate(d.getDate()+n);
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
}

function fmtDate(str){
  if(!str) return '—';
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});
}

function fmtDay(str){
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString('th-TH',{weekday:'long'});
}

function daysDiff(str){
  const now = new Date(); now.setHours(0,0,0,0);
  const d   = new Date(str+'T00:00:00');
  return Math.ceil((d - now) / 86400000);
}

function isOverdue(r){
  return r.status !== 'arrived' && daysDiff(r.serviceDate) < 0;
}

function rateColor(rate){
  return rate >= 100 ? 'gn' : rate >= 90 ? 'yw' : 'rd2';
}
function rateBadge(rate){
  return rate >= 100 ? 'bgg' : rate >= 90 ? 'bgy' : 'bgr';
}
function ratePfill(rate){
  return rate >= 100 ? 'pg' : rate >= 90 ? 'py' : 'pr';
}

function ResForm({branch, onSave, onClose, editing}){
  const init = editing ? {...editing} : {
    customerName:'', phone:'', brand:BRANDS[0], model:'',
    size:SIZES[3], qty:4, reservationDate:TODAY, serviceDate:'', status:'upcoming'
  };
  const [f, setF] = useState(init);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  function save(){
    if(!f.customerName.trim()){ alert('กรุณากรอกชื่อลูกค้า'); return; }
    if(!f.phone.trim()){ alert('กรุณากรอกเบอร์โทรศัพท์'); return; }
    if(!f.serviceDate){ alert('กรุณาเลือกวันนัดเข้ารับบริการ'); return; }
    onSave({...f, branch, id: editing?editing.id:uid(), createdAt: editing?editing.createdAt:new Date().toISOString()});
  }

  const SectionLabel = ({ico, txt}) => h('div',{
    className:'txs sem bl upr mb2b',
    style:{marginTop:4}
  }, `${ico} ${txt}`);

  return h('div',{className:'ov', onClick:onClose},
    h('div',{className:'sh2', onClick:e=>e.stopPropagation()},
      h('div',{className:'hdl'}),
      h('div',{className:'mh'},
        h('div',null,
          h('div',{className:'mt2'}, editing?'✏️ แก้ไขการจอง':'➕ เพิ่มการจองใหม่'),
          h('div',{className:'tsm mu mt1'},`สาขา ${branch}`)
        ),
        h('button',{className:'xb',onClick:onClose}, h(SvgX))
      ),
      h('div',{className:'mb2'},

        h(SectionLabel,{ico:'👤', txt:'ข้อมูลลูกค้า'}),
        h('div',{className:'fg'},
          h('label',{className:'fl'},'ชื่อ-นามสกุล *'),
          h('input',{className:'fi',placeholder:'ชื่อ-นามสกุล',value:f.customerName,onChange:e=>set('customerName',e.target.value)})
        ),
        h('div',{className:'fg'},
          h('label',{className:'fl'},'เบอร์โทรศัพท์ *'),
          h('input',{className:'fi',placeholder:'0xx-xxx-xxxx',type:'tel',value:f.phone,onChange:e=>set('phone',e.target.value)})
        ),

        h('div',{className:'dv'}),
        h(SectionLabel,{ico:'🛞', txt:'ข้อมูลยาง'}),
        h('div',{className:'fg'},
          h('label',{className:'fl'},'แบรนด์'),
          h('select',{className:'fs',value:f.brand,onChange:e=>set('brand',e.target.value)},
            BRANDS.map(b=>h('option',{key:b,value:b},b))

        ),

          h('input',{className:'fi',placeholder:'เช่น Ecopia EP150, Energy XM2+',value:f.model,onChange:e=>set('model',e.target.value)})
        ),
        h('div',{className:'fr2'},
          h('div',{className:'fg'},
            h('label',{className:'fl'},'ขนาดยาง'),
            h('select',{className:'fs',value:f.size,onChange:e=>set('size',e.target.value)},
              SIZES.map(s=>h('option',{key:s,value:s},s))
            )
          ),
          h('div',{className:'fg'},
            h('label',{className:'fl'},'จำนวน (เส้น)'),
            h('select',{className:'fs',value:f.qty,onChange:e=>set('qty',parseInt(e.target.value))},
              [1,2,3,4,5,6,8].map(n=>h('option',{key:n,value:n},`${n} เส้น`))
            )
          )
        ),

        h('div',{className:'dv'}),
        h(SectionLabel,{ico:'📅', txt:'วันที่'}),

function ResCard({res, onArrived, onEdit, onDelete, showBranch}){
  const ov   = isOverdue(res);
  const sc   = res.status==='arrived' ? 'sarr' : ov ? 'sov' : 'sup';
  const days = daysDiff(res.serviceDate);

  return h('div',{className:`rc ${sc}`},
    h('div',{className:'rh'},
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{className:'rn'}, res.customerName),
        h('div',{className:'rp'},
          h(SvgPhone),
          h('span',{className:'mono'}, res.phone),
          showBranch && h('span',{className:'badge bgb',style:{padding:'1px 7px',fontSize:10,marginLeft:6}},`B${res.branch}`)
        )
      ),
      h('div',{style:{flexShrink:0,marginLeft:8}},
        res.status==='arrived'
          ? h('span',{className:'badge bgg'},'✓ เสร็จสิ้น')
          : ov
          ? h('span',{className:'badge bgr'},'⚠ เกินกำหนด')
          : h('span',{className:'badge bgb'}, days===0 ? '📅 วันนี้' : `📅 อีก ${days} วัน`)

    ),

    h('div',{className:'rd'},
      h('div',null,
        h('div',{className:'rdl'},'แบรนด์ / รุ่น'),
        h('div',{className:'rdv'}, `${res.brand}${res.model?' · '+res.model:''}`)
      ),
      h('div',null,
        h('div',{className:'rdl'},'ขนาด × จำนวน'),
        h('div',{className:'rdv mono'}, `${res.size} × ${res.qty}`)
      ),
      h('div',null,
        h('div',{className:'rdl'},'วันที่จอง'),
        h('div',{className:'rdv'}, fmtDate(res.reservationDate))
      ),
      h('div',null,
        h('div',{className:'rdl'},'วันนัดบริการ'),
        h('div',{className:`rdv${ov?' rd2':''}`}, fmtDate(res.serviceDate))
      )
    ),

    h('div',{className:'rf'},
      res.status !== 'arrived'
        ? h('button',{className:'btn bs bsm', onClick:()=>onArrived(res.id)},
            h(SvgCheck,{s:14}), 'ยืนยันเข้ารับบริการ')
        : h('span',{className:'tsm mu'},'✅ รับบริการแล้ว'),

          onClick:()=>onDelete(res.id)
        }, h(SvgTrash))
      )
    )
  );
}

/* ═══════════════════════════════════════════════════
   MENU 1 – รายการจอง
═══════════════════════════════════════════════════ */
function MenuReservations({branch, reservations, onSave, onArrived, onDelete, editingRes, setEditingRes}){
  const [showForm, setShowForm] = useState(false);
  const [delId,   setDelId]    = useState(null);
  const [search,  setSearch]   = useState('');
  const [filt,    setFilt]     = useState('all');

  // เปิด form แก้ไขเมื่อ editingRes เปลี่ยน
  useEffect(()=>{
    if(editingRes){ setShowForm(true); }
  }, [editingRes]);

  const mine = useMemo(()=> reservations.filter(r=>r.branch===branch), [reservations,branch]);

  const cnts = useMemo(()=>({
    all:     mine.length,
    upcoming:mine.filter(r=>r.status==='upcoming'&&!isOverdue(r)).length,
    arrived: mine.filter(r=>r.status==='arrived').length,
    overdue: mine.filter(r=>isOverdue(r)).length,
  }),[mine]);

  const list = useMemo(()=>{
    let l = mine;
    if(filt==='upcoming') l = l.filter(r=>r.status==='upcoming'&&!isOverdue(r));
    else if(filt==='arrived') l = l.filter(r=>r.status==='arrived');
    else if(filt==='overdue') l = l.filter(r=>isOverdue(r));
    if(search.trim()) l = l.filter(r=> r.customerName.includes(search)||r.phone.includes(search));
    return [...l].sort((a,b)=>new Date(a.serviceDate)-new Date(b.serviceDate));
  },[mine,filt,search]);

  function openNew(){ setEditingRes(null); setShowForm(true); }
  function openEdit(r){ setEditingRes(r); setShowForm(true); }

  function handleSave(data){
    onSave(data);
    setShowForm(false);
    setEditingRes(null);
  }
  function handleClose(){
    setShowForm(false);
    setEditingRes(null);
  }

  return h('div',null,
    /* section header */
    h('div',{className:'sh'},
      h('div',null,
        h('div',{className:'st'},'รายการจอง'),
        h('div',{className:'ss'},`สาขา ${branch} · ${cnts.all} รายการ`)
      ),
      h('button',{className:'btn bp bsm',onClick:openNew}, h(SvgPlus),'จองใหม่')
    ),

    /* quick stats */
    h('div',{className:'sg3'},
      h('div',{className:'sc tc'},
        h('div',{className:'sv bl mono'},cnts.upcoming),
        h('div',{className:'sl'},'รอรับบริการ')
      ),
      h('div',{className:'sc tc'},
        h('div',{className:'sv gn mono'},cnts.arrived),
        h('div',{className:'sl'},'เสร็จสิ้น')
      ),
      h('div',{className:'sc tc'},
        h('div',{className:'sv rd2 mono'},cnts.overdue),
        h('div',{className:'sl'},'เกินกำหนด')
      )
    ),

    /* search */
    h('div',{className:'sbar'},
      h(SvgSearch), h('input',{placeholder:'ค้นหาชื่อหรือเบอร์โทร...',value:search,onChange:e=>setSearch(e.target.value)})
    ),

    /* filter chips */
    h('div',{className:'fchips'},
      [['all','ทั้งหมด'],['upcoming','รอรับบริการ'],['arrived','เสร็จสิ้น'],['overdue','เกินกำหนด ⚠']].map(([v,l])=>
        h('button',{key:v,className:`fc${filt===v?' on':''}`,onClick:()=>setFilt(v)},l)
      )
    ),

    /* list */
    list.length===0
      ? h('div',{className:'emp'},
          h('div',{className:'emp-ico'},'📋'),
          h('div',{className:'emp-t'},'ไม่พบรายการ'),
          h('div',{className:'emp-s'},'กด "จองใหม่" เพื่อเพิ่มรายการจองสำหรับสาขานี้')
        )
      : list.map(r=>h(ResCard,{key:r.id, res:r, onArrived, onEdit:openEdit, onDelete:id=>setDelId(id), showBranch:false})),

    /* modals */
    showForm && h(ResForm,{branch, onSave:handleSave, onClose:handleClose, editing:editingRes}),
    delId    && h(ConfirmDlg,{
      title:'ลบรายการจอง',
      text:'ยืนยันการลบรายการจองนี้?\nข้อมูลจะหายไปและไม่สามารถกู้คืนได้',
      ico:'🗑️', okLabel:'ลบออก', okCls:'bd2',
      onOk:()=>{onDelete(delId);setDelId(null);},
      onCancel:()=>setDelId(null)
    })
  );
}

/* ═══════════════════════════════════════════════════
   BRANCH PERFORMANCE CARD
═══════════════════════════════════════════════════ */
function BranchPerfCard({branch, data, reservations, onUpdate, defaultOpen}){
  const [editing, setEditing] = useState(false);
  const [tgt, setTgt] = useState(String(data.target));
  const [act, setAct] = useState(String(data.actual));

  const reserved = useMemo(()=>
    reservations.filter(r=>r.branch===branch&&r.status!=='arrived').reduce((s,r)=>s+r.qty,0),
    [reservations,branch]
  );

  const remaining = Math.max(0, data.target - data.actual);
  const combined  = data.actual + reserved;
  const rate      = data.target > 0 ? (combined / data.target * 100) : 0;
  const daily     = remaining > 0 ? (remaining / 28).toFixed(1) : '—';

  function save(){
    onUpdate(branch,{target:Math.max(0,parseInt(tgt)||0), actual:Math.max(0,parseInt(act)||0)});
    setEditing(false);
  }

  const col  = rateColor(rate);
  const bcl  = rateBadge(rate);
  const pfcl = ratePfill(rate);

  return h('div',{className:'card'},
    /* header row */
    h('div',{className:'fxb mb3'},
      h('div',{className:'fxa g2'},
        h('span',{className:'mono bld',style:{fontSize:17}},`B${branch}`),
        h('span',{className:`badge ${bcl}`},`${rate.toFixed(1)}%`)
      ),
      h('button',{
        className:'btn bo bxs',
        onClick:()=>{ setTgt(String(data.target)); setAct(String(data.actual)); setEditing(!editing); }
      }, h(SvgEdit,{s:12}), editing?'ยกเลิก':'แก้ไข')
    ),

    /* progress */
    h('div',{className:'pb'},
      h('div',{className:`pf ${pfcl}`,style:{width:`${Math.min(100,rate)}%`}})
    ),
    h('div',{className:'fxb txs mu mb3'},
      h('span',null,`รวม ${combined} / ${data.target} เส้น`),
      h('span',{className:`mono sem ${col}`},`${rate.toFixed(1)}%`)
    ),

    editing
      ? h('div',null,
          h('div',{className:'fr2 mb2b'},
            h('div',null,
              h('label',{className:'fl'},'เป้าหมาย (เส้น/เดือน)'),
              h('input',{className:'fi',type:'number',min:0,value:tgt,onChange:e=>setTgt(e.target.value)})
            ),
            h('div',null,
              h('label',{className:'fl'},'ยอดขายจริง (เส้น)'),
              h('input',{className:'fi',type:'number',min:0,value:act,onChange:e=>setAct(e.target.value)})
            )
          ),
          h('button',{className:'btn bp bsm bw',onClick:save}, h(SvgCheck,{s:14}), 'บันทึก')
        )
      : h('div',{className:'sg2', style:{marginBottom:0}},
          ...[
            ['เป้าหมาย',      data.target,  '',   'เส้น/เดือน'],
            ['ขายจริง',       data.actual,  'gn', 'เส้น'],
            ['ยางจอง',        reserved,     'bl', 'เส้น'],
            ['คงเหลือ',       remaining>0?`-${remaining}`:'✓', remaining>0?'rd2':'gn', ''],
            ['ขาย/วัน ที่ต้องการ', daily,  'yw', 'เส้น/วัน'],
            ['รายการจอง',     reservations.filter(r=>r.branch===branch).length, '', 'รายการ'],
          ].map(([lbl,val,clr,unit],i)=>
            h('div',{key:i,className:'sc'},
              h('div',{className:'sl'},lbl),
              h('div',{className:`sv mono${clr?' '+clr:''}`,style:{fontSize:20}},val),
              unit && h('div',{className:'ss2'},unit)
            )
          )
        )
  );
}

/* ═══════════════════════════════════════════════════
   MENU 2 – Dashboard ประสิทธิภาพ
═══════════════════════════════════════════════════ */
function MenuDashboard({branch, branchData, reservations, isAdmin, onUpdate}){
  const [view, setView] = useState(isAdmin?'all':'mine');

  /* คำนวณยอดรวมทุกสาขา */
  const allStats = useMemo(()=>{
    let tgt=0, act=0, res=0;
    BRANCHES.forEach(b=>{
      const d = branchData[b]||{target:0,actual:0};
      const r = reservations.filter(x=>x.branch===b&&x.status!=='arrived').reduce((s,x)=>s+x.qty,0);
      tgt+=d.target; act+=d.actual; res+=r;
    });
    const rate = tgt>0?((act+res)/tgt*100):0;
    return {tgt, act, res, gap:Math.max(0,tgt-act), rate};
  },[branchData,reservations]);

  /* จัดอันดับ */
  const rankings = useMemo(()=>
    BRANCHES.map(b=>{
      const d = branchData[b]||{target:0,actual:0};
      const r = reservations.filter(x=>x.branch===b&&x.status!=='arrived').reduce((s,x)=>s+x.qty,0);
      const rate = d.target>0?((d.actual+r)/d.target*100):0;
      return {b, rate, actual:d.actual, target:d.target, res:r};
    }).sort((a,z)=>z.rate-a.rate),
    [branchData,reservations]
  );

  return h('div',null,
    h('div',{className:'sh'},
      h('div',null,
        h('div',{className:'st'},'ประสิทธิภาพ'),
        h('div',{className:'ss'}, isAdmin?'ทุกสาขา':`สาขา ${branch}`)
      ),
      isAdmin && h('div',{className:'fx g2'},
        [['all','🌐 ทั้งหมด'],['mine','🏢 สาขาฉัน']].map(([v,l])=>
          h('button',{key:v,className:`btn bsm ${view===v?'bp':'bo'}`,onClick:()=>setView(v)},l)
        )
      )
    ),

    /* ── VIEW: ทั้งหมด (admin) ── */
    (isAdmin && view==='all') && h('div',null,

      /* big metric */
      h('div',{className:'mbox'},
        h('div',{className:'sl',style:{marginBottom:8}},'🎯 ยอดรวมทุกสาขา · ประจำเดือน'),
        h('div',{className:`mnum ${rateColor(allStats.rate)}`},
          allStats.rate.toFixed(1),
          h('span',{className:'munit'},' %')
        ),
        h('div',{className:'tsm mu',style:{marginTop:6}},
          `(ขายจริง ${allStats.act} + จอง ${allStats.res}) ÷ เป้า ${allStats.tgt} เส้น`
        )
      ),

      /* summary stats */
      h('div',{className:'sg2'},
        h('div',{className:'sc'},
          h('div',{className:'sl'},'เป้าหมายรวม'),
          h('div',{className:'sv mono'},allStats.tgt),
          h('div',{className:'ss2'},'เส้น / เดือน')
        ),
        h('div',{className:'sc'},
          h('div',{className:'sl'},'ขายจริงรวม'),
          h('div',{className:'sv mono gn'},allStats.act),
          h('div',{className:'ss2'},'เส้น')
        ),
        h('div',{className:'sc'},
          h('div',{className:'sl'},'ยางจองรวม'),
          h('div',{className:'sv mono bl'},allStats.res),
          h('div',{className:'ss2'},'เส้น')
        ),
        h('div',{className:'sc'},
          h('div',{className:'sl'},'คงเหลือรวม'),
          h('div',{className:'sv mono rd2'},allStats.gap),
          h('div',{className:'ss2'},'เส้น')
        )
      ),

      /* ranking */
      h('div',{className:'card'},
        h('div',{className:'fxa g2 mb3'},
          h(SvgTrophy),
          h('span',{className:'bld'},'อันดับสาขาตามอัตราความสำเร็จ')
        ),
        rankings.map((r,i)=>{
          const col  = rateColor(r.rate);
          const pfcl = ratePfill(r.rate);
          const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
          return h('div',{key:r.b,className:'rr'},
            h('span',{style:{fontSize:13,width:22,textAlign:'right',color:'var(--t3)',fontFamily:'var(--mono)'}},`${medal||'#'+  (i+1)}`),
            h('div',{style:{width:58,flexShrink:0}},
              h('div',{className:'mono bld',style:{fontSize:15}},`B${r.b}`),
              h('div',{className:'txs mu'},`${r.actual}/${r.target}`)
            ),
            h('div',{style:{flex:1}},
              h('div',{className:'fxb txs mb1'},
                h('span',null,`จอง +${r.res}`),
                h('span',{className:`mono sem ${col}`},`${r.rate.toFixed(1)}%`)
              ),
              h('div',{className:'pb',style:{height:5,marginBottom:0}},
                h('div',{className:`pf ${pfcl}`,style:{width:`${Math.min(100,r.rate)}%`}})
              )
            )
          );
        })
      )
    ),

    /* ── VIEW: สาขาเดียว ── */
    (view==='mine' || !isAdmin) && h('div',null,
      h(BranchPerfCard,{
        branch, data:branchData[branch]||{target:80,actual:0},
        reservations, onUpdate
      }),
      isAdmin && h('div',null,
        h('div',{className:'st mb3',style:{marginTop:4}},'สาขาอื่นๆ ทั้งหมด'),
        BRANCHES.filter(b=>b!==branch).map(b=>
          h(BranchPerfCard,{key:b, branch:b, data:branchData[b]||{target:80,actual:0}, reservations, onUpdate})
        )
      )
    )
  );
}

/* ═══════════════════════════════════════════════════
   MENU 3 – ตารางนัดประจำวัน
═══════════════════════════════════════════════════ */
function MenuSchedule({branch, reservations, onArrived, onEdit, onDelete, isAdmin}){
  const [selDate, setSelDate] = useState(TODAY);
  const [search,  setSearch]  = useState('');
  const [filt,    setFilt]    = useState('all');

  function changeDay(n){ setSelDate(d=>addDays(d,n)); }

  const isToday   = selDate===TODAY;
  const dateLabel = fmtDate(selDate);
  const dayLabel  = fmtDay(selDate);

  const base = useMemo(()=>{
    let l = reservations.filter(r=>r.serviceDate===selDate);
    if(!isAdmin) l = l.filter(r=>r.branch===branch);
    return l;
  },[reservations,selDate,branch,isAdmin]);

  const cnts = useMemo(()=>({
    total:   base.length,
    arrived: base.filter(r=>r.status==='arrived').length,
    overdue: base.filter(r=>isOverdue(r)).length,
  }),[base]);

  const list = useMemo(()=>{
    let l = base;
    if(filt==='arrived') l = l.filter(r=>r.status==='arrived');
    else if(filt==='overdue') l = l.filter(r=>isOverdue(r));
    else if(filt==='upcoming') l = l.filter(r=>r.status==='upcoming'&&!isOverdue(r));
    if(search.trim()) l = l.filter(r=>r.customerName.includes(search)||r.phone.includes(search));
    return [...l].sort((a,b)=>a.customerName.localeCompare(b.customerName,'th'));
  },[base,filt,search]);

  return h('div',null,
    h('div',{className:'sh'},
      h('div',null,
        h('div',{className:'st'},'ตารางนัดประจำวัน'),
        h('div',{className:'ss'}, isAdmin?'ทุกสาขา':`สาขา ${branch}`)
      ),
      isToday && h('span',{className:'badge bgg'},'● แบบเรียลไทม์')
    ),

    /* date navigation */
    h('div',{className:'dnav'},
      h('button',{className:'dnb',onClick:()=>changeDay(-1)}, h(SvgLeft)),
      h('div',{className:'dinfo'},
        h('div',{className:'dinfo-main'}, isToday ? '📅 วันนี้' : dateLabel),
        h('div',{className:'dinfo-sub'}, isToday ? dateLabel+' · '+dayLabel : dayLabel)
      ),
      h('button',{className:'dnb',onClick:()=>changeDay(1)}, h(SvgRight))
    ),

    /* day stats */
    h('div',{className:'sg3'},
      h('div',{className:'sc tc'},
        h('div',{className:'sv mono',style:{fontSize:24}}, cnts.total),
        h('div',{className:'sl'},'คาดว่าจะมา')
      ),
      h('div',{className:'sc tc'},
        h('div',{className:'sv mono gn',style:{fontSize:24}}, cnts.arrived),
        h('div',{className:'sl'},'มาแล้ว ✓')
      ),
      h('div',{className:'sc tc'},
        h('div',{className:'sv mono rd2',style:{fontSize:24}}, cnts.overdue),
        h('div',{className:'sl'},'ติดตาม ⚠')
      )
    ),

    /* search */
    h('div',{className:'sbar'},
      h(SvgSearch), h('input',{placeholder:'ค้นหาชื่อหรือเบอร์โทร...',value:search,onChange:e=>setSearch(e.target.value)})
    ),

    /* filter chips */
    h('div',{className:'fchips'},
      [['all','ทั้งหมด'],['upcoming','รอรับบริการ'],['arrived','มาแล้ว ✓'],['overdue','ติดตาม ⚠']].map(([v,l])=>
        h('button',{key:v,className:`fc${filt===v?' on':''}`,onClick:()=>setFilt(v)},l)
      )
    ),

    list.length===0
      ? h('div',{className:'emp'},
          h('div',{className:'emp-ico'},'📅'),
          h('div',{className:'emp-t'},'ไม่มีรายการนัด'),
          h('div',{className:'emp-s'},`ไม่มีลูกค้าที่นัดเข้ารับบริการ\nสำหรับ${isToday?'วันนี้':dateLabel}`)
        )
      : list.map(r=>h(ResCard,{key:r.id, res:r, onArrived, onEdit, onDelete, showBranch:isAdmin}))
  );
}

/* ═══════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════ */
function App(){
  const [branch,      setBranch]      = useState('003');
  const [tab,         setTab]         = useState(0);
  const [showBranchM, setShowBranchM] = useState(false);
  const [role,        setRole]        = useState('staff');
  const [reservations,setReservations]= useState(SAMPLE_RES);
  const [branchData,  setBranchData]  = useState(SAMPLE_BD);
  const [toasts,      setToasts]      = useState([]);
  const [editingRes,  setEditingRes]  = useState(null);

  const isAdmin = role === 'admin';

  /* toast helper */
  function toast(msg, type='success'){
    const id = uid();
    setToasts(t=>[...t,{id,message:msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3200);
  }

  /* handlers */
  function handleSave(data){
    setReservations(prev=>{
      const i = prev.findIndex(r=>r.id===data.id);
      if(i>=0){ const n=[...prev]; n[i]=data; return n; }
      return [...prev,data];
    });
    toast(data.id&&reservations.find(r=>r.id===data.id) ? '✅ อัปเดตการจองแล้ว' : '✅ บันทึกการจองใหม่แล้ว');
  }

  function handleArrived(id){
    setReservations(prev=>prev.map(r=>r.id===id?{...r,status:'arrived'}:r));
    toast('✅ ยืนยันลูกค้าเข้ารับบริการแล้ว');
  }

  function handleDelete(id){
    setReservations(prev=>prev.filter(r=>r.id!==id));
    toast('ลบรายการแล้ว','error');
  }

  function handleUpdate(b,data){
    setBranchData(prev=>({...prev,[b]:data}));
    toast(`✅ อัปเดตข้อมูลสาขา ${b} แล้ว`);
  }

  /* edit from schedule → switch to menu 1 */
  function handleEditFromSchedule(r){
    setEditingRes(r);
    setTab(0);
  }

  /* overdue badge count */
  const overdueCount = useMemo(()=>
    reservations.filter(r=>(isAdmin||r.branch===branch)&&isOverdue(r)).length,
    [reservations,branch,isAdmin]
  );

  /* nav tabs config */
  const TABS = [
    {icon:h(SvgReserv,{s:22}), label:'รายการจอง'},
    {icon:h(SvgDash,   {s:22}), label:'ประสิทธิภาพ'},
    {icon:h(SvgCal,    {s:22}), label:'ตารางนัด'},
  ];

  return h('div',{style:{display:'flex',flexDirection:'column',height:'100vh'}},

    /* ── HEADER ── */
    h('div',{className:'hdr'},
      h('div',{className:'logo'},
        h('div',{className:'logo-mark'},'TT'),
        h('div',{className:'logo-text'}, h('b',null,'Tire'),'Track')
      ),
      h('div',{className:'fxa g2'},
        h('div',{
          className:'role-tag',
          onClick:()=>setRole(r=>r==='admin'?'staff':'admin'),
          title:'แตะเพื่อสลับบทบาท'
        },
          h('div',{className:'role-dot',style:{background:isAdmin?'var(--or)':'var(--ac)'}}),
          isAdmin?'ADMIN':'STAFF'
        ),
        h('div',{className:'bpill',onClick:()=>setShowBranchM(true)},
          h('div',{className:'ldot'}),
          `B${branch}`
        )
      )
    ),

    /* ── CONTENT ── */
    h('div',{className:'main'},
      tab===0 && h(MenuReservations,{branch,reservations,onSave:handleSave,onArrived:handleArrived,onDelete:handleDelete,editingRes,setEditingRes}),
      tab===1 && h(MenuDashboard,{branch,branchData,reservations,isAdmin,onUpdate:handleUpdate}),
      tab===2 && h(MenuSchedule,{branch,reservations,onArrived:handleArrived,onEdit:handleEditFromSchedule,onDelete:handleDelete,isAdmin})
    ),

    /* ── BOTTOM NAV ── */
    h('div',{className:'bnav'},
      TABS.map(({icon,label},i)=>
        h('button',{key:i,className:`ntab${tab===i?' on':''}`,onClick:()=>setTab(i)},
          icon, label,
          i===2 && overdueCount>0 && h('div',{className:'nbadge'},overdueCount>9?'9+':overdueCount)
        )
      )
    ),

    /* ── MODALS ── */
    showBranchM && h(BranchModal,{cur:branch,onSelect:setBranch,onClose:()=>setShowBranchM(false)}),

    /* ── TOASTS ── */
    h(Toasts,{list:toasts})
  );
}

/* mount */
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
