<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>TireTrack v2.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#080b12;--surf:#0f1320;--s2:#151b2e;--s3:#1a2138;
  --bd:#222840;--b2:#2a3352;--b3:#334070;
  --tx:#edf0f8;--t2:#8e97b4;--t3:#505878;
  --ac:#3b7dff;--a2:#2563eb;--ag:rgba(59,125,255,.14);
  --gn:#16c979;--gb:rgba(22,201,121,.13);
  --yw:#f5a623;--yb:rgba(245,166,35,.13);
  --rd:#f04060;--rb:rgba(240,64,96,.13);
  --or:#ff7b2c;
  --r:14px;--rs:10px;--rl:18px;
  --font:'Sarabun',sans-serif;--mono:'JetBrains Mono',monospace;
  --sidebar:248px;--hdr:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:40}
.sb-logo{height:calc(var(--hdr) + env(safe-area-inset-top,0));display:flex;align-items:center;gap:11px;padding:env(safe-area-inset-top,0) 20px 0;border-bottom:1px solid var(--bd);flex-shrink:0}
.lmark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b7dff,#6366f1);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.lname{font-size:16px;font-weight:800;letter-spacing:-.4px}
.lname b{color:var(--ac)}
.sb-branch{padding:14px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.sb-pill{display:flex;align-items:center;gap:8px;background:var(--s2);border:1.5px solid var(--b2);border-radius:10px;padding:9px 13px;cursor:pointer;transition:all .15s}
.sb-pill:hover{border-color:var(--ac);background:var(--ag)}
.sb-code{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ac);flex:1}
.sb-live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gn)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--gn);animation:lp 2s infinite;flex-shrink:0}
.ldot.off{background:var(--yw);animation:none}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.2}}
.sb-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:var(--t2);transition:all .15s;margin-bottom:3px;position:relative;border:none;background:none;width:100%;text-align:left;font-family:var(--font)}
.nav-item:hover{background:var(--s2);color:var(--tx)}
.nav-item.on{background:var(--ag);color:var(--ac);font-weight:600}
.nav-item.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--ac);border-radius:0 3px 3px 0}
.nav-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:9px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sb-role{padding:14px 16px;border-top:1px solid var(--bd);flex-shrink:0}
.role-btn{display:flex;align-items:center;gap:9px;width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.role-btn:hover{border-color:var(--b3)}
.rdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.role-info{flex:1;text-align:left}
.role-name{font-size:12px;font-weight:700;color:var(--tx)}
.role-hint{font-size:10px;color:var(--t3);margin-top:1px}

/* MAIN */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;height:100vh;height:100dvh}

/* TOPBAR */
.topbar{height:calc(var(--hdr) + env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) 24px 0;background:var(--surf);border-bottom:1px solid var(--bd);flex-shrink:0;gap:16px}
.tb-left{}
.tb-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.tb-sub{font-size:12px;color:var(--t2);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* MOBILE HEADER */
.m-hdr{display:none;height:calc(var(--hdr) + env(safe-area-inset-top,0));align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) 14px 0;background:var(--surf);border-bottom:1px solid var(--bd);flex-shrink:0;position:sticky;top:0;z-index:30}
.m-hdr-l{display:flex;align-items:center;gap:9px}
.m-hdr-r{display:flex;align-items:center;gap:7px}

/* PAGE */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px}

/* BOTTOM NAV */
.bnav{display:none;background:var(--surf);border-top:1px solid var(--bd);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px;cursor:pointer;border:none;background:none;color:var(--t3);font-family:var(--font);font-size:10px;font-weight:500;transition:color .15s;position:relative}
.ntab.on{color:var(--ac)}
.ntab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--ac);border-radius:0 0 2px 2px}
.nb{position:absolute;top:4px;right:calc(50% - 20px);background:var(--rd);color:#fff;font-size:9px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* RESPONSIVE */
.sidebar{display:flex}
.m-hdr{display:none}
.bnav{display:none}
.topbar{display:flex}
@media(max-width:899px){
  .sidebar{display:none}
  .m-hdr{display:flex}
  .bnav{display:flex}
  .topbar{display:none}
  .page{padding:12px 14px 14px}
}
@media(max-width:480px){.page{padding:10px 12px 12px}}
@media(min-width:900px) and (max-height:560px){
  :root{--sidebar:200px;--hdr:48px}
  .sb-logo{padding:0 14px}
  .sb-branch{padding:10px 12px}
  .sb-nav{padding:8px}
  .nav-item{padding:8px 10px;font-size:13px}
  .sb-role{padding:10px 12px}
  .role-hint{display:none}
  .page{padding:14px 16px}
}
@media(min-width:1400px){:root{--sidebar:264px}}

/* GRIDS */
.g2c{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.g3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.g4c{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.g6c{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.res-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:1100px){
  .g3c{grid-template-columns:repeat(6,1fr)}
  .g6c{grid-template-columns:repeat(6,1fr)}
  .res-grid{grid-template-columns:1fr 1fr}
  .dash-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
}
@media(min-width:700px) and (max-width:1099px){
  .res-grid{grid-template-columns:1fr 1fr}
  .g6c{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:380px){.g3c{grid-template-columns:1fr 1fr}.g2c{grid-template-columns:1fr 1fr}}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;transition:border-color .15s}
.sc:hover{border-color:var(--b3)}
.sc-l{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sc-v{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-1px;line-height:1.05}
.sc-s{font-size:11px;color:var(--t2);margin-top:3px}
@media(min-width:1100px){.sc-v{font-size:24px}}

/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.st{font-size:19px;font-weight:800;letter-spacing:-.4px}
.ss{font-size:13px;color:var(--t2);margin-top:2px}
@media(max-width:480px){.st{font-size:17px}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 18px;height:42px;border-radius:var(--rs);font-family:var(--font);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.bp{background:var(--ac);color:#fff}.bp:hover{background:var(--a2)}
.bo{background:transparent;color:var(--tx);border:1.5px solid var(--b2)}.bo:hover{border-color:var(--ac);color:var(--ac)}
.bsuc{background:var(--gn);color:#fff}
.bdng{background:var(--rd);color:#fff}
.bsm{height:34px;padding:0 13px;font-size:13px;border-radius:8px}
.bxs{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.bw{width:100%}

/* FORMS */
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:block}
.fi,.fsl{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:11px 14px;color:var(--tx);font-family:var(--font);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.fi:focus,.fsl:focus{border-color:var(--ac);background:var(--s3);box-shadow:0 0 0 3px rgba(59,125,255,.12)}
.fi::placeholder{color:var(--t3)}
.fsl{appearance:none;cursor:pointer}
.fsl option{background:var(--s2)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.fr2{grid-template-columns:1fr}}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.5}
.bgg{background:var(--gb);color:var(--gn)}
.bgy{background:var(--yb);color:var(--yw)}
.bgr{background:var(--rb);color:var(--rd)}
.bgb{background:var(--ag);color:var(--ac)}
.bgx{background:rgba(139,151,180,.1);color:var(--t2)}

/* PROGRESS */
.pb{height:6px;background:var(--s3);border-radius:4px;overflow:hidden}
.pb-lg{height:9px}
.pf{height:100%;border-radius:4px;transition:width .6s ease}
.pg{background:linear-gradient(90deg,#0d9e60,var(--gn))}
.py{background:linear-gradient(90deg,#c77f0a,var(--yw))}
.pr{background:linear-gradient(90deg,#bf2040,var(--rd))}

/* RESERVATION CARD */
.rc{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:13px;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.rc:hover{border-color:var(--b3);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.rc.sup::before{background:var(--ac)}
.rc.sarr::before{background:var(--gn)}
.rc.sov::before{background:var(--rd)}
.rc-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.rc-name{font-size:15px;font-weight:700}
.rc-phone{font-size:12px;color:var(--t2);margin-top:2px;display:flex;align-items:center;gap:5px}
.rc-det{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-bottom:11px}
.rc-dl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.rc-dv{font-size:13px;font-weight:500;color:var(--tx)}
.rc-ft{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fa .2s}
@keyframes fa{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surf);border-radius:20px 20px 0 0;border:1px solid var(--bd);border-bottom:none;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;animation:fup .28s ease}
@keyframes fup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:1025px){
  .ov{align-items:center;padding:24px}
  .sheet{border-radius:var(--rl);max-height:90vh;animation:fpop .22s ease}
  @keyframes fpop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
}
.hdl{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:12px auto 0}
@media(min-width:1025px){.hdl{display:none}}
.m-hdr2{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 14px;border-bottom:1px solid var(--bd)}
.m-title{font-size:17px;font-weight:700}
.m-body{padding:18px 22px}
.m-ftr{padding:12px 22px 22px;display:flex;gap:10px}
.xb{width:32px;height:32px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.xb:hover{background:var(--s3);color:var(--tx)}

/* BRANCH PICKER */
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.bb{background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:13px 4px;text-align:center;cursor:pointer;transition:all .15s;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--t2)}
.bb.on{background:var(--ag);border-color:var(--ac);color:var(--ac)}
.bb:hover{border-color:var(--ac);color:var(--ac)}

/* SEARCH & FILTER */
.sbar{display:flex;align-items:center;gap:10px;background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:0 14px;margin-bottom:10px;height:40px;transition:border-color .15s}
.sbar:focus-within{border-color:var(--ac)}
.sbar input{flex:1;background:none;border:none;outline:none;font-family:var(--font);font-size:14px;color:var(--tx)}
.sbar input::placeholder{color:var(--t3)}
.fchips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fc{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:none;color:var(--t2);white-space:nowrap;font-family:var(--font);transition:all .15s}
.fc.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* EMPTY & LOADING */
.emp{text-align:center;padding:32px 20px}
.emp-ico{font-size:40px;margin-bottom:12px;opacity:.35}
.emp-t{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:5px}
.emp-s{font-size:13px;color:var(--t3);line-height:1.7;white-space:pre-line}
.spin{display:inline-block;width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* CONFIRM */
.cov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fa .2s}
.cdlg{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rl);padding:28px;max-width:310px;width:100%;animation:fpop2 .2s ease;box-shadow:0 24px 64px rgba(0,0,0,.6)}
@keyframes fpop2{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* TOAST */
.tcon{position:fixed;top:66px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;z-index:600;pointer-events:none}
@media(min-width:1025px){.tcon{top:14px;right:18px;left:auto;transform:none;width:340px}}
.toast{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:tsl .25s ease;pointer-events:all}
@keyframes tsl{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.tg{border-left:3px solid var(--gn)}.te{border-left:3px solid var(--rd)}.tw{border-left:3px solid var(--yw)}

/* METRIC BOX */
.mbox{background:linear-gradient(135deg,rgba(59,125,255,.1),rgba(99,102,241,.05));border:1px solid rgba(59,125,255,.22);border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center}
.mnum{font-size:38px;font-weight:800;font-family:var(--mono);letter-spacing:-2px;line-height:1.05}
.munit{font-size:18px;font-weight:400;color:var(--t2)}

/* RANK */
.rr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rr:last-child{border-bottom:none}

/* DIVIDER */
.dv{height:1px;background:var(--bd);margin:14px 0}

/* SYNC CHIP */
.sync-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px}

/* UTILS */
.gn{color:var(--gn)}.yw{color:var(--yw)}.rd{color:var(--rd)}.bl{color:var(--ac)}.mu{color:var(--t2)}
.mono{font-family:var(--mono)}.bld{font-weight:700}.sem{font-weight:600}
.fx{display:flex}.fxa{display:flex;align-items:center}.fxb{display:flex;align-items:center;justify-content:space-between}
.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb5{margin-bottom:20px}
.mt2{margin-top:8px}.mt3{margin-top:12px}
.w100{width:100%}.tc{text-align:center}
.tsm{font-size:13px}.txs{font-size:11px}
.upr{text-transform:uppercase;letter-spacing:.5px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* LANDSCAPE OVERRIDES - must be last */
@media(max-width:899px) and (orientation:landscape){
  :root{--hdr:42px}
  .m-hdr{padding-left:12px;padding-right:12px}
  .lmark{width:26px;height:26px;border-radius:7px;font-size:10px}
  .lname{font-size:13px}
  .page{padding:8px 12px}
  .sh{margin-bottom:7px}
  .st{font-size:15px}
  .ss{font-size:11px}
  .mbox-hide-land{display:none}
  .mbox{padding:8px 14px;margin-bottom:8px}
  .mnum{font-size:24px}
  .g2c,.g3c{margin-bottom:6px;gap:6px}
  .sc{padding:5px 9px}
  .sc-v{font-size:15px}
  .sc-l{font-size:8px;margin-bottom:2px}
  .sc-s{font-size:9px;margin-top:1px}
  .sbar{height:36px;margin-bottom:8px}
  .fchips{margin-bottom:8px}
  .fc{padding:4px 12px;font-size:12px}
  .card{padding:10px;margin-bottom:8px}
  .ntab{padding:5px 0 4px;font-size:9px}
  .ntab svg{width:17px;height:17px}
  .emp{padding:8px 20px}
  .emp-ico{font-size:24px;margin-bottom:4px}
  .emp-t{font-size:13px;margin-bottom:2px}
  .emp-s{font-size:11px}
  .rc{padding:10px}
  .g6c{gap:5px;margin-bottom:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const {createElement:h,useState,useEffect,useMemo,useCallback,useRef} = React;

/* HELPERS */
function todayStr(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fmtDate(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDay(s){return new Date(s+'T00:00:00').toLocaleDateString('th-TH',{weekday:'long'});}
function daysDiff(s){const n=new Date();n.setHours(0,0,0,0);return Math.ceil((new Date(s+'T00:00:00')-n)/86400000);}
function isOv(r){return r.status!=='arrived'&&daysDiff(r.service_date)<0;}
function rCol(v){return v>=100?'gn':v>=90?'yw':'rd';}
function rBadge(v){return v>=100?'bgg':v>=90?'bgy':'bgr';}
function rPf(v){return v>=100?'pg':v>=90?'py':'pr';}

/* BRANCH PERFORMANCE CARD - read-only, synced from Cockpit */
function BPCard({branch,data,reservations}){
  const reserved=useMemo(()=>reservations.filter(r=>r.branch===branch&&r.status!=='arrived').reduce((s,r)=>s+r.qty+(r.qty2||0),0),[reservations,branch]);
  const remaining=Math.max(0,data.target-(data.actual+reserved));
  const combined=data.actual+reserved;
  const rate=data.target>0?(combined/data.target*100):0;
  const dailyRaw=remaining>0?Math.ceil(remaining/28):0;
  const daily=dailyRaw>0?(Math.ceil(dailyRaw/4)*4):'—';
  const col=rCol(rate);const pfcl=rPf(rate);const bcl=rBadge(rate);
  return h('div',{className:'card'},
    h('div',{className:'fxb mb3'},
      h('div',{className:'fxa g2'},
        h('span',{className:'mono bld',style:{fontSize:17}},'B'+branch),
        h('span',{className:'badge '+bcl},rate.toFixed(1)+'%')

      h('div',{className:'fxa',style:{gap:4,fontSize:10,color:'var(--gn)',fontWeight:700}},

      h('span',null,'รวม '+combined+' / '+data.target+' เส้น'),
      h('span',{className:'mono sem '+col},rate.toFixed(1)+'%')
    ),
    h('div',{className:'g6c'},
      [['เป้าหมาย',data.target,'','เส้น/เดือน'],['ขายจริง',data.actual,'gn','เส้น'],['ยางจอง',reserved,'bl','เส้น'],['คงเหลือ',remaining>0?'-'+remaining:'✓',remaining>0?'rd':'gn',''],['ขาย/วัน',daily,'yw','เส้น/วัน'],['รายการจอง',reservations.filter(r=>r.branch===branch).length,'','รายการ']].map(([lbl,val,clr,unit],i)=>

/* ROOT APP */
function App(){
  const [branch,setBranch]=useState(()=>{try{return localStorage.getItem('tt_branch')||'003';}catch{return'003';}});
  function selectBranch(b){setBranch(b);try{localStorage.setItem('tt_branch',b);}catch{}}
  const [tab,setTab]=useState(0);
  const [showBM,setShowBM]=useState(false);
  const [role,setRole]=useState('staff');
  const [reservations,setReservations]=useState([]);
  const [branchData,setBranchData]=useState({});
  const [toasts,setToasts]=useState([]);
  const [editingRes,setEditingRes]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [lastCockpitSync,setLastCockpitSync]=useState(null);
  const [loadR,setLoadR]=useState(true);
  const [loadB,setLoadB]=useState(true);
  const [saving,setSaving]=useState(false);
  const [synced,setSynced]=useState(false);
  const isAdmin=role==='admin';
  const isFirstLoad=useRef(true);

  useEffect(()=>{ if(editingRes) setShowForm(true); },[editingRes]);

  function toast(msg,type){
    const id=Math.random().toString(36).slice(2);
    const m={success:{cls:'tg',ico:'✅'},error:{cls:'te',ico:'❌'},warn:{cls:'tw',ico:'⚠️'}};
    const t=m[type]||m.success;
    setToasts(p=>[...p,{id,msg,cls:t.cls,ico:t.ico}]);
    setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)),3500);
  }

  // Tracks IDs that were just changed locally (optimistic update) so background
  // polling/realtime doesn't accidentally overwrite them with stale server data
  // before the write has fully committed.
  const recentlyChanged = useRef(new Map()); // id -> expiry timestamp
  function markRecentlyChanged(id, ms=4000){
    recentlyChanged.current.set(id, Date.now()+ms);
  }
  function isRecentlyChanged(id){
    const exp = recentlyChanged.current.get(id);
    if(!exp) return false;
    if(Date.now() > exp){ recentlyChanged.current.delete(id); return false; }
    return true;
  }

  async function loadRes(silent=false){
    if(!sb){setLoadR(false);return;}
    if(!silent)setLoadR(true);
    try{
      const {data,error}=await sb.from('tt_reservations').select('*').order('service_date');
      if(error){if(!silent)toast('โหลดข้อมูลไม่สำเร็จ: '+error.message,'error');}
      else if(data){
        setReservations(prev=>{
          const serverIds=new Set(data.map(r=>r.id));
          const merged=data.map(serverRow=>{
            // Never let a background refresh overwrite a row the user just edited —
            // protects against the optimistic update being clobbered by a server
            // read that raced ahead of the write actually committing.
            if(isRecentlyChanged(serverRow.id)){
              const local=prev.find(r=>r.id===serverRow.id);
              if(local) return local;
            }
            const local=prev.find(r=>r.id===serverRow.id);
            if(local&&JSON.stringify(local)===JSON.stringify(serverRow))return local;
            return serverRow;
          });
          prev.forEach(r=>{if(!serverIds.has(r.id))merged.push(r);});
          return merged;
        });
      }
    }catch(e){if(!silent)toast('เชื่อมต่อฐานข้อมูลไม่ได้','error');}
    if(!silent)setLoadR(false);
    isFirstLoad.current=false;
  }

  async function loadBD(silent=false){
    if(!sb){setLoadB(false);return;}
    if(!silent)setLoadB(true);
    try{
      const {data,error}=await sb.from('tt_branch_data').select('*');
      if(error){if(!silent)toast('โหลดข้อมูลสาขาไม่สำเร็จ','error');}
      else if(data){
        setBranchData(prev=>{
          const next={...prev};let changed=false;
          data.forEach(r=>{const p=prev[r.branch];if(!p||p.target!==r.target||p.actual!==r.actual){next[r.branch]={target:r.target,actual:r.actual};changed=true;}});
          return changed?next:prev;
        });
      }
    }catch(e){if(!silent)toast('เชื่อมต่อฐานข้อมูลไม่ได้','error');}
    if(!silent)setLoadB(false);
  }

  async function syncFromCockpit(silent=false){
    if(!cp){if(!silent)toast('ไม่ได้เชื่อมต่อ Cockpit Intelligence','error');return;}
    try{
      const [cfgRes,deRes,tgtRes]=await Promise.all([
        cp.from('app_data').select('value').eq('key','cp_cfg').single(),
        cp.from('app_data').select('value').eq('key','cp_de').single(),
        cp.from('app_data').select('value').eq('key','cp_tgt').single(),
      ]);
      if(cfgRes.error||!cfgRes.data){if(!silent)toast('ดึงข้อมูล Cockpit ไม่ได้','error');return;}
      if(deRes.error||!deRes.data){if(!silent)toast('ดึงยอดขายรายวันไม่ได้','error');return;}
      if(tgtRes.error||!tgtRes.data){if(!silent)toast('ดึงเป้าหมายไม่ได้','error');return;}
      const todayDay=parseInt(cfgRes.data.value.todayDay)||1;
      const daily=deRes.data.value;
      const targets=tgtRes.data.value;
      // คำนวณยอดขายสะสม
      const actualMap={};
      Object.keys(daily).forEach(branch=>{
        let total=0;
        for(let d=1;d<=todayDay;d++){
          const day=daily[branch][String(d)];
          if(day)total+=Math.max(0,parseInt(day.tire)||0);
        }
        actualMap[branch]=total;
      });
      // ดึงเป้าหมาย
      const targetMap={};
      Object.keys(targets).forEach(branch=>{
        const t=parseInt(targets[branch].tire)||0;
        if(t>0)targetMap[branch]=t;
      });
      // เขียนลง DB
      if(sb){
        const allB=new Set([...Object.keys(actualMap),...Object.keys(targetMap)]);
        for(const b of allB){
          const p={};
          if(actualMap[b]!==undefined)p.actual=actualMap[b];
          if(targetMap[b]!==undefined)p.target=targetMap[b];
          if(Object.keys(p).length>0)await sb.from('tt_branch_data').update(p).eq('branch',b);
        }
      }
      // อัปเดต local state
      setBranchData(prev=>{
        const next={...prev};
        const allB=new Set([...Object.keys(actualMap),...Object.keys(targetMap)]);
        allB.forEach(b=>{
          if(next[b]){
            if(actualMap[b]!==undefined)next[b]={...next[b],actual:actualMap[b]};
            if(targetMap[b]!==undefined)next[b]={...next[b],target:targetMap[b]};
          }
        });
        return next;
      });
      const cnt=new Set([...Object.keys(actualMap),...Object.keys(targetMap)]).size;
      if(!silent)toast('ซิงก์ยอดขาย + เป้าหมายจาก Cockpit เรียบร้อย ('+cnt+' สาขา)');
      setLastCockpitSync(new Date());
    }catch(e){if(!silent)toast('ซิงก์ Cockpit ล้มเหลว: '+(e.message||''),'error');}
  }

  useEffect(()=>{
    loadRes();loadBD();
    setTimeout(()=>syncFromCockpit(true),2000);
    if(!sb)return;
    let chR=null,chB=null,pollTimer=null;
    try{
      chR=sb.channel('tt_res_ch').on('postgres_changes',{event:'*',schema:'public',table:'tt_reservations'},p=>{
        if(p.eventType==='INSERT')setReservations(prev=>{if(prev.find(r=>r.id===p.new.id))return prev;return [...prev,p.new];});
        else if(p.eventType==='UPDATE')setReservations(prev=>prev.map(r=>r.id===p.new.id?p.new:r));
        else if(p.eventType==='DELETE')setReservations(prev=>prev.filter(r=>r.id!==p.old.id));
      }).subscribe(s=>{if(s==='SUBSCRIBED')setSynced(true);});
      chB=sb.channel('tt_bd_ch').on('postgres_changes',{event:'*',schema:'public',table:'tt_branch_data'},p=>{
        if(p.new){const r=p.new;setBranchData(prev=>({...prev,[r.branch]:{target:r.target,actual:r.actual}}));}
      }).subscribe();
    }catch(e){console.warn('Realtime unavailable:',e.message);}
    pollTimer=setInterval(()=>{
      if(document.querySelector('.sheet'))return;
      loadRes(true);loadBD(true);syncFromCockpit(true);
    },30000);
    return()=>{
      try{if(chR)sb.removeChannel(chR);if(chB)sb.removeChannel(chB);}catch(e){}
      if(pollTimer)clearInterval(pollTimer);
    };
  },[]);

  async function handleSave(data){
    if(!sb){toast('ยังไม่ได้เชื่อมต่อฐานข้อมูล','error');return;}
    setSaving(true);
    const isEdit=reservations.some(r=>r.id===data.id);
    const prevSnap=reservations;
    const payload={id:data.id,branch:data.branch,customer_name:data.customer_name,phone:data.phone,customer_type:data.customer_type||CUST_TYPES[0],brand:data.brand,model:data.model,size:data.size,qty:data.qty,model2:data.model2||null,size2:data.size2||null,qty2:data.qty2||null,reservation_date:data.reservation_date,service_date:data.service_date,status:data.status||'upcoming'};
    markRecentlyChanged(data.id);
    if(isEdit)setReservations(prev=>prev.map(r=>r.id===data.id?{...r,...payload}:r));
    else setReservations(prev=>[...prev,payload]);
    let ok=false;
    try{
      if(isEdit){const {error}=await sb.from('tt_reservations').update(payload).eq('id',data.id);if(error)toast('อัปเดตไม่สำเร็จ: '+error.message,'error');else{ok=true;toast('อัปเดตการจองแล้ว');}}
      else{const {error}=await sb.from('tt_reservations').insert([payload]);if(error)toast('บันทึกไม่สำเร็จ: '+error.message,'error');else{ok=true;toast('บันทึกการจองใหม่แล้ว');}}
    }catch(e){toast('บันทึกไม่สำเร็จ: '+(e.message||''),'error');}
    if(!ok)setReservations(prevSnap);
    setSaving(false);setEditingRes(null);
  }

  async function handleArrived(id){
    if(!sb){toast('ยังไม่ได้เชื่อมต่อ','error');return;}
    markRecentlyChanged(id);
    setReservations(prev=>prev.map(r=>r.id===id?{...r,status:'arrived'}:r));
    try{const {error}=await sb.from('tt_reservations').update({status:'arrived'}).eq('id',id);if(error)toast('อัปเดตสถานะไม่สำเร็จ','error');else toast('ยืนยันลูกค้าเข้ารับบริการแล้ว');}
    catch(e){toast('อัปเดตสถานะไม่สำเร็จ','error');}
  }

  async function handleDelete(id){
    if(!sb){toast('ยังไม่ได้เชื่อมต่อ','error');return;}
    setReservations(prev=>prev.filter(r=>r.id!==id));
    try{const {error}=await sb.from('tt_reservations').delete().eq('id',id);if(error)toast('ลบไม่สำเร็จ','error');else toast('ลบรายการแล้ว','error');}
    catch(e){toast('ลบไม่สำเร็จ','error');}
  }

  function handleEditFromSchedule(r){setEditingRes(r);setTab(0);}

  const overdueCount=useMemo(()=>reservations.filter(r=>(isAdmin||r.branch===branch)&&isOv(r)).length,[reservations,branch,isAdmin]);

  const TABS=[{icon:h(SDoc,{s:20}),label:'รายการจอง'},{icon:h(SGrd,{s:20}),label:'ประสิทธิภาพ'},{icon:h(SCal,{s:20}),label:'ติดตามลูกค้า'}];
  const PAGE=[{t:'รายการจอง',s:'สาขา '+branch},{t:'ประสิทธิภาพสาขา',s:isAdmin?'ทุกสาขา':'สาขา '+branch},{t:'รายการติดตามลูกค้า',s:isAdmin?'ทุกสาขา':'สาขา '+branch}];
  const vBadge=h('span',{style:{fontSize:9,fontWeight:600,color:'var(--gn)',background:'var(--gb)',padding:'2px 6px',borderRadius:5,marginLeft:7,verticalAlign:'middle',fontFamily:'var(--mono)'}},'v3.2');

  return h('div',{id:'app'},
    /* SIDEBAR */
    h('div',{className:'sidebar'},
      h('div',{className:'sb-logo'},h('div',{className:'lmark'},'TT'),h('div',{className:'lname'},h('b',null,'Tire'),'Track',vBadge)),
      h('div',{className:'sb-branch'},
        h('div',{className:'sb-lbl'},'สาขาที่ทำงาน'),
        h('div',{className:'sb-pill',onClick:()=>setShowBM(true)},
          h('span',{className:'sb-code'},'B'+branch),
          h('div',{className:'sb-live'},h('div',{className:'ldot'+(synced?'':' off')}),synced?'ออนไลน์':'อัตโนมัติ')
        )
      ),
      h('div',{className:'sb-nav'},
        TABS.map(({icon,label},i)=>h('button',{key:i,className:'nav-item'+(tab===i?' on':''),onClick:()=>setTab(i)},
          icon,label,i===2&&overdueCount>0&&h('span',{className:'nav-badge'},overdueCount>9?'9+':overdueCount)
        ))
      ),
      h('div',{className:'sb-role'},
        h('div',{className:'sb-lbl'},'บทบาท'),
        h('button',{className:'role-btn',onClick:()=>setRole(r=>r==='admin'?'staff':'admin')},
          h('div',{className:'rdot',style:{background:isAdmin?'var(--or)':'var(--ac)'}}),
          h('div',{className:'role-info'},h('div',{className:'role-name'},isAdmin?'ผู้ดูแลระบบ (Admin)':'พนักงานสาขา (Staff)'),h('div',{className:'role-hint'},'แตะเพื่อสลับบทบาท'))
        )
      )
    ),
    /* MAIN */
    h('div',{className:'main-area'},
      /* TOPBAR */
      h('div',{className:'topbar'},
        h('div',{className:'tb-left'},h('div',{className:'tb-title'},PAGE[tab].t),h('div',{className:'tb-sub'},PAGE[tab].s)),
        h('div',{className:'tb-right'},
          lastCockpitSync&&h('div',{className:'fxa',style:{gap:5,fontSize:10,color:'var(--gn)'}},
            h('div',{style:{width:6,height:6,borderRadius:'50%',background:'var(--gn)',flexShrink:0}}),
            'Cockpit '+lastCockpitSync.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
          ),
          h('div',{className:'sync-chip'},h('div',{className:'ldot'+(synced?'':' off')}),synced?'ซิงก์ Realtime':'อัตโนมัติ'),
          h('button',{className:'btn bo bsm',onClick:()=>{loadRes();loadBD();syncFromCockpit(true);}},h(SRef),'รีเฟรช')
        )
      ),
      /* MOBILE HEADER */
      h('div',{className:'m-hdr'},
        h('div',{className:'m-hdr-l'},h('div',{className:'lmark'},'TT'),h('div',{className:'lname'},h('b',null,'Tire'),'Track',vBadge)),
        h('div',{className:'m-hdr-r'},
          h('div',{className:'sync-chip'},h('div',{className:'ldot'+(synced?'':' off')}),synced?'สด':'อัตโนมัติ'),
          h('div',{className:'sb-pill',style:{padding:'4px 10px'},onClick:()=>setShowBM(true)},
            h('div',{className:'ldot'}),h('span',{style:{fontFamily:'var(--mono)',fontSize:13,fontWeight:600,color:'var(--ac)'}},'B'+branch)
          ),
          h('button',{className:'btn bo bxs',style:{fontSize:11},onClick:()=>setRole(r=>r==='admin'?'staff':'admin')},
            h('div',{className:'rdot',style:{width:6,height:6,background:isAdmin?'var(--or)':'var(--ac)'}}),
            isAdmin?'ADMIN':'STAFF'
          )
        )
      ),
      /* PAGE CONTENT */
      h('div',{className:'page'},
        tab===0&&h(Menu1,{branch,reservations,loading:loadR,onSave:handleSave,onArrived:handleArrived,onDelete:handleDelete,editingRes,setEditingRes,saving,showForm,setShowForm}),
        tab===1&&h(Menu2,{branch,branchData,reservations,isAdmin,loading:loadB,onSyncCockpit:syncFromCockpit}),
        tab===2&&h(Menu3,{branch,reservations,onArrived:handleArrived,onEdit:handleEditFromSchedule,onDelete:handleDelete,isAdmin,loading:loadR})
      ),
      /* BOTTOM NAV */
      h('div',{className:'bnav'},
        TABS.map(({icon,label},i)=>h('button',{key:i,className:'ntab'+(tab===i?' on':''),onClick:()=>setTab(i)},
          icon,label,i===2&&overdueCount>0&&h('div',{className:'nb'},overdueCount>9?'9+':overdueCount)
        ))
      )
    ),
    /* MODALS */
    showForm&&h(ResForm,{branch:editingRes?editingRes.branch:branch,onSave:d=>{handleSave(d);setShowForm(false);setEditingRes(null);},onClose:()=>{setShowForm(false);setEditingRes(null);},editing:editingRes,saving}),
    showBM&&h(BranchModal,{cur:branch,onSelect:selectBranch,onClose:()=>setShowBM(false)}),
    h(Toasts,{list:toasts})
  );
}

try{ReactDOM.createRoot(document.getElementById('app')).render(h(App));}
catch(e){document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#edf0f8;font-family:sans-serif"><div style="font-size:40px;margin-bottom:16px">⚠️</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">เกิดข้อผิดพลาด</div><div style="font-size:14px;color:#8e97b4">'+(e.message||'')+'</div></div>';}
})();
</script>
</body>
</html>
